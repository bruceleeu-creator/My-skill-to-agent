name: Update AGENTS.md skills block

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update-skills:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build AGENTS.md from skills
        uses: dave1010/skills-to-agents@v1
        with:
          agents-path: AGENTS.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --exit-code; then
            echo "No changes to AGENTS.md"
            exit 0
          fi
          git add AGENTS.md
          git commit -m "chore: update AGENTS.md skills block [skip ci]"
          git push
