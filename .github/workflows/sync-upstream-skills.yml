name: Auto-update skills and AGENTS.md

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * 1" # 每周一 09:00 北京时间兜底
  workflow_dispatch:

concurrency:
  group: skills-auto-update
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pull skill updates per sync-sources.txt
        shell: bash
        run: |
          set -uo pipefail
          FAIL=0
          declare -A CLONED
          while IFS='|' read -r repo src dest; do
            [[ -z "${repo// /}" || "${repo:0:1}" == "#" ]] && continue
            if [[ -z "${CLONED[$repo]:-}" ]]; then
              echo "Cloning $repo ..."
              if ! git clone --quiet --depth 1 "https://github.com/${repo}.git" "/tmp/src/${repo}"; then
                echo "::warning::clone failed: $repo"; FAIL=1; continue
              fi
              CLONED[$repo]=1
            fi
            if [[ ! -d "/tmp/src/${repo}/${src}" ]]; then
              echo "::warning::upstream path missing (renamed?): ${repo}/${src}"; FAIL=1; continue
            fi
            mkdir -p "${dest}"
            cp -R "/tmp/src/${repo}/${src}/." "${dest}/"
          done < sync-sources.txt
          # 单条失败仅告警不中断，已成功的更新照常提交

      - name: Rebuild AGENTS.md
        uses: dave1010/skills-to-agents@v1
        with:
          skills-dir: .agents/skills
          agents-path: AGENTS.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/skills AGENTS.md
          if git diff --cached --quiet; then
            echo "All skills already up to date."
            exit 0
          fi
          git commit -m "chore: sync skills from upstream sources [skip ci]"
          git push
